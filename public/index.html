<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Livre d'Or</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 💄 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4">📖 Livre d'Or</h1>

        <!-- Formulaire -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="form">
                    <div class="mb-3">
                        <input id="nom" type="text" class="form-control" placeholder="Votre nom" required>
                    </div>
                    <div class="mb-3">
                        <textarea id="message" class="form-control" rows="3" placeholder="Votre message"
                            required></textarea>
                    </div>
                    <div class="mb-3">
                        <input id="note" type="number" class="form-control" min="1" max="5" placeholder="Note (1 à 5)">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Envoyer</button>
                </form>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages"></div>
    </div>

    <!-- Bootstrap JS (pour animations ou modals si besoin) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script JS -->
    <script>
        async function chargerMessages() {
            const res = await fetch('/messages');
            const messages = await res.json();

            document.getElementById('messages').innerHTML = messages.map(m =>
                `<div class="card mb-3 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">${m.nom}</h5>
            <h6 class="card-subtitle mb-2 text-muted">${new Date(m.date).toLocaleDateString()}</h6>
            <p class="card-text">${m.message}</p>
            <div class="text-end">Note : ${m.note ?? '—'}</div>
          </div>
        </div>`
            ).join('');
        }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nom = document.getElementById('nom').value;
            const message = document.getElementById('message').value;
            const note = parseInt(document.getElementById('note').value) || null;

            await fetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom, message, note })
            });

            e.target.reset();
            chargerMessages();
        });

        chargerMessages();
    </script>
</body>

</html>
